<!doctype html>
<html>
  <body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; line-height:1.5; color:#111">
    <h2>Reset your password</h2>
    <p>Hi {{ user_name }},</p>
    <p>We received a request to reset your password. Click below to choose a new one:</p>
    <p>
      <a href="{{ reset_url }}" style="display:inline-block;padding:10px 16px;background:#0ea5e9;color:#fff;text-decoration:none;border-radius:8px">
        Reset password
      </a>
    </p>
    <p>If the button doesn’t work, copy this link into your browser:</p>
    <p><a href="{{ reset_url }}">{{ reset_url }}</a></p>
    <p>This link expires in {{ expires_minutes }} minutes.</p>
    <p>— The Neura team</p>
  </body>
</html>
